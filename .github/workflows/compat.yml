name: Compatibility (scheduled)

# New TypeScript releases should surface here before a PR hits them.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types-consumer:
    name: Consumer types (TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.typescript == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.2', latest, next]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:types-consumer
        env:
          TS_VERSION: ${{ matrix.typescript }}
