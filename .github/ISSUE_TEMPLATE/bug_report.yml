name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A short reproduction helps most: a [playground](https://masyaka.github.io/injecute/playground) share link, a repository, or a code block.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the error `code` and message if there was one.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: injecute version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and TypeScript version
      placeholder: Node.js 24, TypeScript 5.9 (or Deno 2.4, Bun 1.3, Chrome 140)
    validations:
      required: true
